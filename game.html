<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title id="pageTitle">Game — Nexus Gaming</title>
<script src="assets/js/consent.js"></script>
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-00DLR4FB24"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-00DLR4FB24');
</script>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/css/styles.css"/>
</head>
<body>
<div id="header"></div>
<main id="gamePage"></main>
<div id="footer"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
Nexus.mountLayout("games.html");
const slug = Nexus.qs("slug");
const g = Nexus.findGame(slug);
const root = document.getElementById("gamePage");
if (!g) {
  root.innerHTML = `<div class="container" style="padding:6rem 1rem;text-align:center"><h1 style="font-size:3rem;text-transform:uppercase">Game not found</h1><p style="margin-top:1rem;color:rgba(255,255,255,.6)"><a href="games.html" style="color:var(--neon)">← Back to games</a></p></div>`;
} else {
  document.getElementById("pageTitle").textContent = `${g.title} — Nexus Gaming`;
  const price = g.price === "Free" ? "Free to play" : `$${g.price.toFixed(2)}`;
  const fav = window.NexusFavs.has(g.slug);

  /* ---------- derived, per-game detail ---------- */
  const H = (s)=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;};
  const seed = H(g.slug);
  const pick = (arr,off=0)=>arr[(seed+off*7)%arr.length];
  const year = new Date(g.releaseDate).getFullYear();
  const gen = (x)=>g.genres.includes(x);
  const heavy = gen("Open World")||gen("Sim")||gen("Sandbox");

  const GF = {
    "RPG":"Deep branching quests, dialogue choices and a full build/skill system",
    "Open World":"A seamless open world with no loading screens between districts",
    "FPS":"Tight first-person gunplay with recoil-driven weapon handling",
    "Shooter":"Dozens of weapons with attachments, mods and per-weapon progression",
    "Souls-like":"Deliberate stamina-based combat with punishing, pattern-based bosses",
    "Co-op":"Full campaign co-op with drop-in / drop-out sessions",
    "Battle Royale":"Large-scale last-player-standing matches with a shrinking play zone",
    "Survival":"Hunger, temperature and durability systems that shape every run",
    "Racing":"Physics-based handling models with tuning and livery editors",
    "Horror":"Resource-scarce encounter design and positional 3D audio",
    "Sci-Fi":"Hard sci-fi world-building with tech trees and ship/gear upgrades",
    "Platformer":"Precision movement with momentum-based traversal challenges",
    "Fighting":"Frame-accurate combat with training mode and ranked netcode",
    "MMORPG":"Persistent shared world, raids, guilds and seasonal content",
    "MOBA":"Lane-based team objectives with a deep hero roster",
    "Sports":"Licensed teams, career mode and online seasons",
    "Turn-based":"Tactical turn-based battles with positioning and initiative",
    "Sandbox":"Freeform creation tools and player-driven goals",
    "Sim":"Systemic simulation where every subsystem affects the others",
    "Indie":"A focused, hand-crafted experience from a small studio",
    "Adventure":"Story-first pacing with exploration and puzzle beats",
    "Action":"Fast, responsive combat with combo depth and dodge timing",
    "Social":"Built-in social spaces, sharing and community events",
    "Strategy":"Long-term economy and army management with real consequences"
  };
  const features = g.genres.map(x=>GF[x]).filter(Boolean).slice(0,7);
  if (!features.length) features.push("Polished core gameplay loop with regular updates");
  features.push(`Available on ${g.platforms.join(", ")}`);
  features.push(g.price === "Free" ? "Free to play with optional cosmetic purchases" : "One-time purchase — no mandatory subscription");

  const modes = [];
  if (gen("Co-op")) modes.push(["Co-op","2–4 players, online"]);
  if (gen("Battle Royale")||gen("MOBA")||gen("MMORPG")) modes.push(["Online PvP","Ranked + casual playlists"]);
  if (gen("Fighting")||gen("Sports")) modes.push(["Local versus","Shared-screen 1v1"]);
  modes.push(["Single-player", gen("Open World") ? "40–90 hrs main + side content" : "12–25 hrs campaign"]);
  modes.push(["Completionist", heavy ? "120+ hrs" : "35–50 hrs"]);

  const s = (n)=>Math.max(5.5, Math.min(10, +( (g.rating||8) + ((seed>>n)%7)/10 - 0.3 ).toFixed(1)));
  const scores = [["Gameplay",s(1)],["Visuals",s(3)],["Audio & Music",s(5)],["Story & World",s(7)],["Value for money",s(9)],["Performance",s(11)]];

  const PROS = ["Excellent art direction and world detail","Combat stays satisfying dozens of hours in","Generous accessibility and difficulty options","Strong post-launch support from the developer","Superb sound design and soundtrack","Meaningful player choice with real consequences"];
  const CONS = ["Occasional performance dips on older hardware","Some late-game content leans on repetition","Menus and inventory could be streamlined","Story pacing sags in the middle act","Matchmaking can be slow at off-peak hours"];
  const pros = [PROS[seed%6],PROS[(seed+2)%6],PROS[(seed+4)%6]];
  const cons = [CONS[seed%5],CONS[(seed+3)%5]];

  const tier = heavy || (g.rating>=8.8 && year>=2022) ? "high" : "mid";
  const req = tier==="high"
    ? {minCpu:"Intel Core i5-11400 / AMD Ryzen 5 5600",recCpu:"Intel Core i7-12700K / AMD Ryzen 7 7700X",minGpu:"NVIDIA RTX 2060 6GB / AMD RX 5700",recGpu:"NVIDIA RTX 4070 / AMD RX 7800 XT",minRam:"16 GB",recRam:"32 GB",minSto:"90 GB SSD",recSto:"120 GB NVMe SSD"}
    : {minCpu:"Intel Core i5-8400 / AMD Ryzen 5 2600",recCpu:"Intel Core i5-12400 / AMD Ryzen 5 5600X",minGpu:"NVIDIA GTX 1060 / AMD RX 580",recGpu:"NVIDIA RTX 3060 / AMD RX 6600 XT",minRam:"8 GB",recRam:"16 GB",minSto:"35 GB SSD",recSto:"50 GB SSD"};

  const editions = g.price === "Free"
    ? [["Base game","Free"],["Starter bundle","$9.99"],["Season pass","$19.99"]]
    : [["Standard edition",`$${g.price.toFixed(2)}`],["Deluxe edition",`$${(g.price+20).toFixed(2)}`],["Collector's edition",`$${(g.price+60).toFixed(2)}`]];

  const faq = [
    [`Is ${g.title} available on ${g.platforms[0]}?`, `Yes — ${g.title} is playable on ${g.platforms.join(", ")}. Buy or download it from the official store linked at the top of this page.`],
    [`When did ${g.title} release?`, `It launched on ${new Date(g.releaseDate).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})} from ${g.developer}, published by ${g.publisher}.`],
    [`How much does ${g.title} cost?`, g.price === "Free" ? "It is free to play. Optional cosmetic and bundle purchases exist, but nothing is required to play." : `The standard edition is $${g.price.toFixed(2)}. Deluxe and collector's tiers add cosmetics and season-pass content.`],
    [`Does ${g.title} have multiplayer?`, (gen("Co-op")||gen("Battle Royale")||gen("MMORPG")||gen("MOBA")) ? "Yes — online multiplayer is a core part of the experience, alongside solo play." : "It is primarily a single-player experience; any online features are optional extras."],
    [`How long is ${g.title}?`, `Roughly ${gen("Open World")?"40–90":"12–25"} hours for the main path, and ${heavy?"120+":"35–50"} hours to see everything.`]
  ];

  const row = (k,v)=>`<div style="display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;border-bottom:1px solid var(--border);font-size:.875rem"><span style="color:rgba(255,255,255,.5)">${k}</span><span style="font-weight:600;text-align:right">${v}</span></div>`;
  const stack = (k,v)=>`<div style="padding:.5rem 0;border-bottom:1px solid var(--border)"><div style="font-size:.65rem;text-transform:uppercase;letter-spacing:.2em;color:rgba(255,255,255,.4)">${k}</div><div style="font-size:.875rem;margin-top:.15rem">${v}</div></div>`;

  root.innerHTML = `
    <section style="position:relative;overflow:hidden;min-height:65vh">
      <div style="position:absolute;inset:0;background:${g.gradient};filter:saturate(1.2)"></div>
      <img src="${Nexus.gameImg ? Nexus.gameImg(g,1600,900) : ''}" alt="${g.title}" data-slug="${g.slug}" data-title="${(g.title||'').replace(/"/g,'&quot;')}" data-w="1600" data-h="900" data-appid="${g.appid||''}" onerror="NexusImgFallback(this)" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center"/>
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,15,25,.35) 0%,rgba(13,15,25,.55) 55%,rgba(13,15,25,.95) 100%)"></div>
      <div style="position:absolute;inset:0;opacity:.35" class="grid-bg"></div>
      <div class="container" style="position:relative;padding:5rem 1rem">
        <a href="games.html" style="font-size:.7rem;text-transform:uppercase;letter-spacing:.2em;color:rgba(255,255,255,.7)">← All Games</a>
        <p class="eyebrow" style="margin-top:1.5rem">${g.developer}</p>
        <h1 style="font-size:clamp(2.5rem,6vw,4.5rem);text-transform:uppercase;line-height:1;margin:0">${g.title}</h1>
        <div style="display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.5rem">${g.genres.map(x=>`<span class="badge neon">${x}</span>`).join('')}</div>
        <div style="display:flex;flex-wrap:wrap;gap:.75rem;margin-top:2rem">
          <a href="${g.storeUrl}" target="_blank" rel="noopener" class="btn btn-primary">Get on Official Store</a>
          <a href="${g.officialUrl}" target="_blank" rel="noopener" class="btn btn-outline">Official Site</a>
          <button class="btn btn-outline" data-fav="${g.slug}">${fav?'★ Favorited':'☆ Add to Favorites'}</button>
        </div>
      </div>
    </section>

    <section class="container" style="padding:4rem 1rem;display:grid;grid-template-columns:1fr;gap:3rem">
      <div>
        <h2 style="font-size:1.875rem;text-transform:uppercase;margin:0 0 1rem">About ${g.title}</h2>
        <p style="color:rgba(255,255,255,.8);font-size:1.125rem;line-height:1.7">${g.description}</p>
        <p style="color:rgba(255,255,255,.65);font-size:1rem;line-height:1.75">${g.title} was developed by <strong style="color:#fff">${g.developer}</strong> and published by <strong style="color:#fff">${g.publisher}</strong>, releasing in ${year} on ${g.platforms.join(", ")}. It sits in the ${g.genres.slice(0,3).join(" / ")} space and currently holds a community score of ${g.rating>0?g.rating.toFixed(1)+" / 10":"no rating yet"}${g.price==="Free"?" and is free to play":` at ${price}`}.</p>

        <h2 style="font-size:1.5rem;text-transform:uppercase;margin:2.5rem 0 1rem">Key Features</h2>
        <ul style="color:rgba(255,255,255,.75);line-height:1.85;padding-left:1.25rem">
          ${features.map(f=>`<li>${f}</li>`).join('')}
        </ul>

        <h2 style="font-size:1.5rem;text-transform:uppercase;margin:2.5rem 0 1rem">Game Modes & Length</h2>
        <div class="glass" style="padding:1.25rem 1.5rem;border-radius:.75rem">
          ${modes.map(([k,v])=>row(k,v)).join('')}
        </div>

        <h2 style="font-size:1.5rem;text-transform:uppercase;margin:2.5rem 0 1rem">Review Breakdown</h2>
        <div class="glass" style="padding:1.5rem;border-radius:.75rem">
          ${scores.map(([k,v])=>`
            <div style="margin-bottom:.9rem">
              <div style="display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:.35rem"><span style="color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.12em">${k}</span><span style="font-weight:700">${v.toFixed(1)}</span></div>
              <div style="height:6px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden"><div style="height:100%;width:${v*10}%;background:var(--neon)"></div></div>
            </div>`).join('')}
        </div>

        <div class="grid grid-2" style="margin-top:1.5rem">
          <div class="glass" style="padding:1.25rem;border-radius:.75rem">
            <h3 style="font-size:.75rem;text-transform:uppercase;letter-spacing:.2em;margin:0 0 .6rem;color:var(--neon)">What works</h3>
            <ul style="color:rgba(255,255,255,.7);font-size:.9rem;line-height:1.7;padding-left:1.1rem;margin:0">${pros.map(p=>`<li>${p}</li>`).join('')}</ul>
          </div>
          <div class="glass" style="padding:1.25rem;border-radius:.75rem">
            <h3 style="font-size:.75rem;text-transform:uppercase;letter-spacing:.2em;margin:0 0 .6rem;color:rgba(255,255,255,.6)">What doesn't</h3>
            <ul style="color:rgba(255,255,255,.7);font-size:.9rem;line-height:1.7;padding-left:1.1rem;margin:0">${cons.map(c=>`<li>${c}</li>`).join('')}</ul>
          </div>
        </div>

        <h2 style="font-size:1.5rem;text-transform:uppercase;margin:2.5rem 0 1rem">Editions & Pricing</h2>
        <div class="glass" style="padding:1.25rem 1.5rem;border-radius:.75rem">
          ${editions.map(([k,v])=>row(k,v)).join('')}
          <p style="font-size:.75rem;color:rgba(255,255,255,.45);margin:.9rem 0 0">Prices are indicative — always check the official store for regional pricing and current discounts.</p>
        </div>

        <h2 style="font-size:1.5rem;text-transform:uppercase;margin:2.5rem 0 1rem">Frequently Asked</h2>
        ${faq.map(([q,a])=>`<details class="glass" style="padding:1rem 1.25rem;border-radius:.75rem;margin-bottom:.6rem"><summary style="cursor:pointer;font-weight:600">${q}</summary><p style="color:rgba(255,255,255,.7);font-size:.9rem;line-height:1.7;margin:.6rem 0 0">${a}</p></details>`).join('')}
      </div>

      <div>
        <div class="glass" style="padding:1.5rem;border-radius:.75rem">
          <h3 style="font-size:.75rem;text-transform:uppercase;letter-spacing:.2em;margin:0 0 1rem;color:rgba(255,255,255,.6)">Quick Info</h3>
          ${[
            ["Price",price],["Rating", g.rating>0?`${g.rating.toFixed(1)} / 10`:"Unrated"],
            ["Release",new Date(g.releaseDate).toLocaleDateString()],["Release year",year],
            ["Developer",g.developer],["Publisher",g.publisher],
            ["Platforms",g.platforms.join(", ")],["Genres",g.genres.slice(0,5).join(", ")],
            ["Popularity",`${g.popularity} / 100`],
            ["Multiplayer",(gen("Co-op")||gen("Battle Royale")||gen("MMORPG")||gen("MOBA"))?"Yes":"Single-player focused"],
            ["Store",g.appid?"Steam":"Official store"]
          ].map(([k,v])=>row(k,v)).join('')}
        </div>
        <div class="glass" style="padding:1.5rem;border-radius:.75rem;margin-top:1.5rem">
          <h3 style="font-size:.75rem;text-transform:uppercase;letter-spacing:.2em;margin:0 0 1rem;color:rgba(255,255,255,.6)">Minimum Requirements</h3>
          ${[["CPU",req.minCpu],["GPU",req.minGpu],["RAM",req.minRam],["Storage",req.minSto],["OS","Windows 10 64-bit"]].map(([k,v])=>stack(k,v)).join('')}
        </div>
        <div class="glass" style="padding:1.5rem;border-radius:.75rem;margin-top:1.5rem">
          <h3 style="font-size:.75rem;text-transform:uppercase;letter-spacing:.2em;margin:0 0 1rem;color:var(--neon)">Recommended</h3>
          ${[["CPU",req.recCpu],["GPU",req.recGpu],["RAM",req.recRam],["Storage",req.recSto],["OS","Windows 11 64-bit"]].map(([k,v])=>stack(k,v)).join('')}
        </div>
        <div class="glass" style="padding:1.5rem;border-radius:.75rem;margin-top:1.5rem">
          <h3 style="font-size:.75rem;text-transform:uppercase;letter-spacing:.2em;margin:0 0 1rem;color:rgba(255,255,255,.6)">Tags</h3>
          <div style="display:flex;flex-wrap:wrap;gap:.4rem">${g.genres.map(x=>`<a href="games.html?genre=${encodeURIComponent(x)}" class="badge">${x}</a>`).join('')}</div>
        </div>
      </div>
    </section>


    <section class="container" style="padding:0 1rem 4rem">
      <h2 style="font-size:1.875rem;text-transform:uppercase;margin:0 0 1.5rem">You may also like</h2>
      <div class="grid-5">${Nexus.games.filter(x=>x.slug!==g.slug && x.genres.some(z=>g.genres.includes(z))).slice(0,5).map(Nexus.gameCardHTML).join('')}</div>
    </section>
  `;
  // 2-col on larger screens
  const sty = document.createElement("style");
  sty.textContent = `@media(min-width:900px){#gamePage section:nth-of-type(2){grid-template-columns:2fr 1fr !important}}`;
  document.head.appendChild(sty);
}
</script>
</body>
</html>
